[project]
name = "rag"
version = "0.1.0"
description = "Multi-tenant RAG chatbot platform: FastAPI API, Celery ingestion worker and pgvector retrieval"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aioboto3>=13.2",
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "azure-storage-blob>=12.24",
    "celery[redis]>=5.4",
    "cryptography>=50.0.0",
    "fastapi[standard]>=0.141.1",
    "langchain-anthropic>=1.5.6",
    "langchain-aws>=1.1.0",
    "langchain-core>=0.3.29",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=0.3",
    "langchain-text-splitters>=0.3.5",
    "markdown-it-py>=3.0",
    "openai>=1.60",
    "opentelemetry-api>=1.29",
    "opentelemetry-exporter-otlp-proto-grpc>=1.29",
    "opentelemetry-instrumentation-celery>=0.50b0",
    "opentelemetry-instrumentation-fastapi>=0.50b0",
    "opentelemetry-instrumentation-redis>=0.50b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.50b0",
    "opentelemetry-sdk>=1.29",
    "pgvector>=0.4.1",
    "prometheus-fastapi-instrumentator>=7.0",
    "pwdlib[argon2]>=0.2.1",
    "pydantic-settings>=2.7",
    "pyjwt>=2.10",
    "pypdf>=5.1",
    "python-docx>=1.1",
    "redis>=5.2",
    "sqlmodel>=0.0.39",
    "structlog>=24.4",
    "tenacity>=9.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # bugbear
    "C4",   # comprehensions
    "SIM",  # simplify
    "RUF",  # ruff-specific
    "BLE",  # blind except
    "ASYNC",
]
ignore = [
    "B008",  # FastAPI dependencies are declared as call expressions in defaults
    "E501",  # line length is enforced by the formatter
]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E402"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.uv]
package = false
