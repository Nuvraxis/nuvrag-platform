worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    charset       utf-8;

    # Writable by the unprivileged nginx user.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    log_format json escape=json '{"time":"$time_iso8601","remote_addr":"$remote_addr",'
        '"method":"$request_method","uri":"$uri","status":$status,'
        '"bytes":$body_bytes_sent,"referer":"$http_referer","rt":$request_time}';
    access_log /var/log/nginx/access.log json;

    sendfile      on;
    tcp_nopush    on;
    server_tokens off;

    keepalive_timeout 30;
    client_max_body_size 1m;

    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   512;
    gzip_proxied      any;
    # text/html is always compressed by nginx and must not be listed again.
    gzip_types        application/javascript text/css application/json image/svg+xml;

    # Basic abuse protection at the edge. In production a CDN absorbs the bulk of this
    # traffic and nginx only ever sees origin fetches.
    limit_req_zone $binary_remote_addr zone=widget:10m rate=30r/s;
    limit_req_status 429;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Cross-Origin-Resource-Policy cross-origin always;

        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 'ok';
        }

        location /widget/ {
            limit_req zone=widget burst=60 nodelay;
            include /etc/nginx/widget-headers.conf;

            # Content-hashed assets never change under a given name. The pattern is quoted
            # because nginx would otherwise read the `{10}` quantifier as a block.
            location ~* "^/widget/.+-[0-9a-f]{10}\.(js|css)$" {
                include /etc/nginx/widget-headers.conf;
                add_header Cache-Control "public, max-age=31536000, immutable" always;
                try_files $uri =404;
            }

            # The loader URL is permanent, so it gets a short cache: a version rollout has
            # to reach tenant pages in minutes, not after a year-long TTL expires.
            location = /widget/loader.js {
                include /etc/nginx/widget-headers.conf;
                add_header Cache-Control "public, max-age=300, must-revalidate" always;
                try_files $uri =404;
            }

            # Replaced at deploy time and read on every page load, so it must not be held in
            # a cache while the API address it names has already moved.
            location = /widget/config.json {
                include /etc/nginx/widget-headers.conf;
                add_header Cache-Control "no-cache" always;
                try_files $uri =404;
            }

            location = /widget/manifest.json {
                include /etc/nginx/widget-headers.conf;
                add_header Cache-Control "public, max-age=60, must-revalidate" always;
                try_files $uri =404;
            }

            # frame.html is the iframe document; it must stay framable by tenant sites, so
            # no X-Frame-Options or frame-ancestors lockdown here.
            location = /widget/frame.html {
                include /etc/nginx/widget-headers.conf;
                add_header Cache-Control "public, max-age=60, must-revalidate" always;
                try_files $uri =404;
            }

            try_files $uri =404;
        }

        location / {
            return 404;
        }
    }
}
