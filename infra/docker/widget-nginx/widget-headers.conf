# nginx does not inherit `add_header` into a nested location that declares any of its own,
# so every widget location includes this snippet rather than relying on the parent block.

# The bundle is meant to be embeddable from anywhere. The real origin restriction is the
# API's per-chatbot allowed_origins check, not this file server.
add_header Access-Control-Allow-Origin "*" always;
add_header Cross-Origin-Resource-Policy cross-origin always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
