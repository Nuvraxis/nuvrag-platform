# Copy to values-secrets.yaml, fill it in, and pass it after the environment file:
#
#   helm upgrade --install rag infra/helm/rag-platform \
#     --values infra/helm/values-config.yaml \
#     --values infra/helm/values-secrets.yaml
#
# values-secrets.yaml is gitignored. This example is the committed record of which keys the
# release expects — keep the two in step, and keep real values out of this file.
#
# Anything passed this way is readable through `helm get values rag`, which is fine for a
# cluster you administer alone. Where it is not, create the Secret out of band and set
# `secrets.create: false`:
#
#   kubectl create secret generic rag-platform-secrets -n rag \
#     --from-literal=DB_CONNECTION_STRING=... --from-literal=SECURITY_JWT_SECRET=...

secrets:
  create: true
  existingSecret: rag-platform-secrets
  values:
    # The API's role should NOT own the tables: row-level security does not apply to the
    # owner, so a single role leaves every tenant policy inert.
    DB_CONNECTION_STRING: postgresql+asyncpg://rag_app:PASSWORD@postgres.data.svc.cluster.local:5432/rag_db
    # The owner, used for migrations and for the lookups that happen before a tenant is known.
    DB_PRIVILEGED_DSN: postgresql+asyncpg://rag_owner:PASSWORD@postgres.data.svc.cluster.local:5432/rag_db

    REDIS_URL: redis://redis.data.svc.cluster.local:6379/0

    # openssl rand -base64 48
    SECURITY_JWT_SECRET: ""

    # Encrypts the provider API keys tenants enter in the dashboard. Required — the API will
    # not start without it, and rotating it makes every stored credential unreadable, so keep
    # a copy wherever you keep the database password.
    #   python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
    AI_CREDENTIALS_ENCRYPTION_KEY: ""

    # Only for `config.storage.backend: s3`; MinIO's root credentials work here.
    STORAGE_S3_ACCESS_KEY_ID: ""
    STORAGE_S3_SECRET_ACCESS_KEY: ""
