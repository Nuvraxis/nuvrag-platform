{{- if .Values.secrets.create }}
# Rendered from `secrets.values`, which is what `values-secrets.yaml` fills in. Everything
# passed this way is readable through `helm get values rag`, so on a cluster with more than
# one operator, create the Secret out of band and leave `create: false`.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.existingSecret }}
  labels:
    {{- include "rag.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- include "rag.secretData" . | nindent 2 }}
{{- end }}
