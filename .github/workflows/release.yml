  #       run: |
  #         helm upgrade --install rag infra/helm/rag-platform \
  #           --namespace "${{ vars.K8S_NAMESPACE }}" --create-namespace \
  #           --set image.registry="${REGISTRY}" \
  #           --set image.repository="${IMAGE_PREFIX,,}" \
  #           --set image.tag="sha-${GITHUB_SHA}" \
  #           --values infra/helm/values-config.yaml \
  #           --wait --timeout 10m
